name: Build

on:
  push:
    paths-ignore:
      - '**.md'
  pull_request:
    paths-ignore:
      - '**.md'

permissions:
  contents: read

jobs:
  creator-tools:
    strategy:
      matrix:
        os: [macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      # setup-node's lts/* can lag nodejs.org when a new major turns LTS; see
      # docs/foundation/engineering-policy.md#runtime-and-toolchain-versions.
      - name: Find the newest Node LTS on nodejs.org
        id: node
        shell: bash
        run: |
          version=$(curl -fsSL --retry 3 https://nodejs.org/dist/index.json |
            jq -er '[.[] | select(.lts) | .version | ltrimstr("v")] | max_by(split(".") | map(tonumber))')
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ steps.node.outputs.version }}
          cache: npm
      - run: npm ci
      - run: npm run art:build
      - run: npm run check
      - if: runner.os == 'Windows'
        run: npm run package:linux

  linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      # setup-node's lts/* can lag nodejs.org when a new major turns LTS; see
      # docs/foundation/engineering-policy.md#runtime-and-toolchain-versions.
      - name: Find the newest Node LTS on nodejs.org
        id: node
        shell: bash
        run: |
          version=$(curl -fsSL --retry 3 https://nodejs.org/dist/index.json |
            jq -er '[.[] | select(.lts) | .version | ltrimstr("v")] | max_by(split(".") | map(tonumber))')
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ steps.node.outputs.version }}
          cache: npm
      - run: npm ci
      - name: Install foundation check dependencies
        run: sudo apt-get update && sudo apt-get install --yes shellcheck
      - run: bin/check --full
      - run: npm run dist:linux
      - uses: actions/upload-artifact@v7
        with:
          name: steam-game-linux-x64
          path: release/*.AppImage
          if-no-files-found: error
