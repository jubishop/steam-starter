name: Build

on:
  push:
    paths-ignore:
      - '**.md'
  pull_request:
    paths-ignore:
      - '**.md'

permissions:
  contents: read

jobs:
  creator-tools:
    strategy:
      matrix:
        os: [macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: lts/*
          check-latest: true
          cache: npm
      - run: npm ci
      - run: npm run art:build
      - run: npm run check
      - if: runner.os == 'Windows'
        run: npm run package:linux

  linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: lts/*
          check-latest: true
          cache: npm
      - run: npm ci
      - name: Install foundation check dependencies
        run: sudo apt-get update && sudo apt-get install --yes shellcheck
      - run: bin/check --full
      - run: npm run dist:linux
      - uses: actions/upload-artifact@v7
        with:
          name: steam-game-linux-x64
          path: release/*.AppImage
          if-no-files-found: error
